name: RMR OpenSSL silicon contract

on:
  pull_request:
    paths:
      - 'rmr/**'
      - '.github/workflows/rmr-openssl-silicon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmake-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Toolchain identity
        run: |
          cmake --version
          ctest --version
          ninja --version
          cc --version
          clang --version
          ld.lld --version
          readelf --version

      - name: Canonical CMake flags and KAT audit
        working-directory: rmr
        run: sh tools/audit_cmake_contract.sh

      - name: Legacy cross-object audit
        working-directory: rmr
        run: sh tools/audit_contract.sh

      - name: Upload evidence receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rmr-openssl-silicon-contract
          path: |
            rmr/out/build/host-native-release/cmake_receipt.txt
            rmr/out/build/host-native-release/CMAKE_SHA256SUMS
            rmr/out/build/host-native-release/rmr-cmake-flags-Release.txt
            rmr/out/build/host-native-release/evp_bench.csv
            rmr/out/build/host-native-release/sha256_uop_receipt.txt
            rmr/out/build/host-native-release/SHA256_UOP_SHA256SUMS
            rmr/out/build/portable-release/rmr-cmake-flags-Release.txt
            rmr/out/build/portable-release/sha256_uop_receipt.txt
            rmr/out/build/portable-release/SHA256_UOP_SHA256SUMS
            rmr/build/SHA256SUMS
            rmr/build/receipt.txt
          if-no-files-found: error
          retention-days: 30
